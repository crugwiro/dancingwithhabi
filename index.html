<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dancing with Habi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo-container">
        <img src="https://i.ibb.co/w479FwH/IMG-7537.png" alt="Dancing with Habi Logo">
        <span>Dancing with Habi</span>
    </div>
    <nav>
      <ul class="nav-menu">
        <li class="dropdown">
          <a href="#events">Events</a>
          <ul class="dropdown-menu">
            <li><a href="#upcoming">Upcoming Events</a></li>
            <li><a href="#past">Past Events</a></li>
          </ul>
        </li>
        <li class="dropdown">
          <a href="#classes">Classes</a>
          <ul class="dropdown-menu">
            <li><a href="#beginner">Beginner</a></li>
            <li><a href="#intermediate">Intermediate</a></li>
            <li><a href="#advanced">Advanced</a></li>
          </ul>
        </li>
        <li class="dropdown">
          <a href="#footage">Footage</a>
          <ul class="dropdown-menu">
            <li><a href="#class-footage">Class Footage</a></li>
            <li><a href="#event-footage">Event Footage</a></li>
          </ul>
        </li>
      </ul>
    </nav>
    <div class="header-right">
      <button class="get-quote" onclick="alert('Get a Quote')">Get Quote</button>
    </div>
  </header>

  <section class="hero">
    <video autoplay loop muted>
      <source src="dance.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="hero-content">
      <h1>Unleash Your Passion for Dance</h1>
      <p>Discover classes, join events, and create a community.</p>
      <div class="hero-buttons">
        <button onclick="window.location.href='#classes'">Book a Class</button>
        <button onclick="window.location.href='your-footage-download-link.zip'">Download Footage</button>
      </div>
    </div>
  </section>
</body>
</html>
